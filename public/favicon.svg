<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <!-- Cube wireframe gradient (Neon Pink to Cyan) -->
    <linearGradient id="cubeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="100%" stop-color="#00f3ff" />
    </linearGradient>

    <!-- Orbit 1 (Cyan to Neon Green) -->
    <linearGradient id="orbitGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#00f3ff" stop-opacity="1" />
      <stop offset="100%" stop-color="#00ff87" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="orbitGrad1Front" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00ff87" stop-opacity="1" />
      <stop offset="50%" stop-color="#00f3ff" stop-opacity="1" />
      <stop offset="100%" stop-color="#00f3ff" stop-opacity="0.1" />
    </linearGradient>

    <!-- Orbit 2 (Pink to Sun Gold) -->
    <linearGradient id="orbitGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#ff007f" stop-opacity="1" />
      <stop offset="100%" stop-color="#ffeb3b" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="orbitGrad2Front" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffeb3b" stop-opacity="1" />
      <stop offset="50%" stop-color="#ff007f" stop-opacity="1" />
      <stop offset="100%" stop-color="#ff007f" stop-opacity="0.1" />
    </linearGradient>

    <!-- Center Core Node Radial Gradient (White to Gold to Orange) -->
    <radialGradient id="coreGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#ffeb3b" />
      <stop offset="100%" stop-color="#ff5722" />
    </radialGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Intense glow for nodes -->
    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .hud-hud {
        stroke: #ffffff;
        opacity: 0.15;
      }
      @media (prefers-color-scheme: light) {
        .hud-hud {
          stroke: #0a0a0a;
          opacity: 0.12;
        }
      }
    </style>
  </defs>

  <!-- Ambient HUD Background Markings -->
  <g fill="none" class="hud-hud">
    <circle cx="256" cy="256" r="240" stroke-width="1.5" />
    <circle cx="256" cy="256" r="246" stroke-width="1" stroke-dasharray="10 30" />
    <line x1="256" y1="0" x2="256" y2="512" stroke-width="0.5" stroke-dasharray="4 8" />
    <line x1="0" y1="256" x2="512" y2="256" stroke-width="0.5" stroke-dasharray="4 8" />
  </g>

  <!-- Layer 1: Back Orbits (Behind Cube) -->
  <!-- Horizontal Orbit Back -->
  <g transform="translate(256, 256) rotate(-15)">
    <path d="M -210,0 A 210,60 0 0,0 210,0" fill="none" stroke="url(#orbitGrad1)" stroke-width="12" stroke-linecap="round" />
  </g>
  <!-- Vertical Orbit Back -->
  <g transform="translate(256, 256) rotate(75)">
    <path d="M -210,0 A 210,50 0 0,0 210,0" fill="none" stroke="url(#orbitGrad2)" stroke-width="10" stroke-linecap="round" />
  </g>

  <!-- Layer 2: Cube Back Edges (Low Opacity, Translucent) -->
  <g fill="none" stroke="url(#cubeGrad)" stroke-linecap="round" stroke-linejoin="round" opacity="0.35">
    <path d="M 152,316 L 256,256 L 360,316 M 256,136 L 256,256" stroke-width="12" />
  </g>

  <!-- Layer 3: Cube Front Edges (High Opacity, Glowing) -->
  <g fill="none" stroke="url(#cubeGrad)" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)">
    <path d="M 256,136 L 152,196 L 152,316 L 256,376 L 360,316 L 360,196 Z" stroke-width="20" />
    <path d="M 256,256 L 152,196 M 256,256 L 360,196 M 256,256 L 256,376" stroke-width="20" />
  </g>

  <!-- Layer 4: Front Orbits (In Front of Cube) -->
  <!-- Horizontal Orbit Front -->
  <g transform="translate(256, 256) rotate(-15)">
    <path d="M 210,0 A 210,60 0 0,0 -210,0" fill="none" stroke="url(#orbitGrad1Front)" stroke-width="12" stroke-linecap="round" />
  </g>
  <!-- Vertical Orbit Front -->
  <g transform="translate(256, 256) rotate(75)">
    <path d="M 210,0 A 210,50 0 0,0 -210,0" fill="none" stroke="url(#orbitGrad2Front)" stroke-width="10" stroke-linecap="round" />
  </g>

  <!-- Layer 5: Glowing Vertex Nodes -->
  <!-- Outer vertices (White glow) -->
  <g fill="#ffffff" filter="url(#nodeGlow)">
    <circle cx="256" cy="136" r="10" />
    <circle cx="152" cy="196" r="10" />
    <circle cx="360" cy="196" r="10" />
    <circle cx="152" cy="316" r="10" />
    <circle cx="360" cy="316" r="10" />
    <circle cx="256" cy="376" r="10" />
  </g>
  
  <!-- Central Core Node (Gold Glow - Processor / CubeSat Payload) -->
  <circle cx="256" cy="256" r="16" fill="url(#coreGrad)" filter="url(#nodeGlow)" />
</svg>
