<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Iridescent Neon Gradients matching Jalen's site palette -->
    <!-- Gradient 1: Cobalt Blue to Cyan (Portfolio Primary Accents) -->
    <linearGradient id="gradCobaltCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#00f3ff" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="gradCobaltCyanFront" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="1" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.15" />
    </linearGradient>

    <!-- Gradient 2: Cyan to Sun Gold (Retro phosphors / workstation accents) -->
    <linearGradient id="gradCyanGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffeb3b" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="gradCyanGoldFront" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffeb3b" stop-opacity="1" />
      <stop offset="100%" stop-color="#00f3ff" stop-opacity="0.15" />
    </linearGradient>

    <!-- Gradient 3: Sun Gold to Brand Red (Bulldog UGA red & warm brand pop) -->
    <linearGradient id="gradGoldRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffeb3b" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#e0352b" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="gradGoldRedFront" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#e0352b" stop-opacity="1" />
      <stop offset="100%" stop-color="#ffeb3b" stop-opacity="0.15" />
    </linearGradient>

    <!-- Shaded Face Gradients for the Hologram Octahedron Core -->
    <linearGradient id="faceTL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="faceTR" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0352b" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#ffeb3b" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="faceBL" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#00f3ff" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="faceBR" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffeb3b" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#e0352b" stop-opacity="0.05" />
    </linearGradient>

    <!-- Core Center Dot Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#00f3ff" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0" />
    </radialGradient>

    <!-- Visual filter glow effects -->
    <filter id="hologramGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .hud-line {
        stroke: #ffffff;
        opacity: 0.12;
      }
      .hud-bracket {
        stroke: #ffffff;
        opacity: 0.35;
      }
      @media (prefers-color-scheme: light) {
        .hud-line {
          stroke: #0a0a0a;
          opacity: 0.08;
        }
        .hud-bracket {
          stroke: #0a0a0a;
          opacity: 0.3;
        }
      }
    </style>
  </defs>

  <!-- Layer 1: Ambient HUD Viewfinder & Coordinates -->
  <g fill="none">
    <!-- Concentric radar circles -->
    <circle cx="256" cy="256" r="235" class="hud-line" stroke-width="1.5" />
    <circle cx="256" cy="256" r="242" class="hud-line" stroke-width="1.2" stroke-dasharray="12 24" />
    <!-- Center crosshair segments (leaving center clear for core) -->
    <line x1="256" y1="12" x2="256" y2="150" class="hud-line" stroke-width="1" stroke-dasharray="4 8" />
    <line x1="256" y1="362" x2="256" y2="500" class="hud-line" stroke-width="1" stroke-dasharray="4 8" />
    <line x1="12" y1="256" x2="150" y2="256" class="hud-line" stroke-width="1" stroke-dasharray="4 8" />
    <line x1="362" y1="256" x2="500" y2="256" class="hud-line" stroke-width="1" stroke-dasharray="4 8" />
    
    <!-- Camera Viewfinder Corner Brackets -->
    <g class="hud-bracket" stroke-width="4" stroke-linecap="round">
      <path d="M 50,90 L 50,50 L 90,50" />
      <path d="M 462,90 L 462,50 L 422,50" />
      <path d="M 50,422 L 50,462 L 90,462" />
      <path d="M 462,422 L 462,462 L 422,462" />
    </g>
  </g>

  <!-- Layer 2: Back Gyroscope Orbits (Behind Central Core) -->
  <g fill="none" stroke-linecap="round">
    <!-- Ring 1 Back (Cobalt-Cyan, rotated -15°) -->
    <g transform="translate(256, 256) rotate(-15)">
      <path d="M -200,0 A 200,60 0 0,0 200,0" stroke="url(#gradCobaltCyan)" stroke-width="12" />
    </g>
    <!-- Ring 2 Back (Cyan-Gold, rotated 45°) -->
    <g transform="translate(256, 256) rotate(45)">
      <path d="M -200,0 A 200,60 0 0,0 200,0" stroke="url(#gradCyanGold)" stroke-width="12" />
    </g>
    <!-- Ring 3 Back (Gold-Red, rotated -45°) -->
    <g transform="translate(256, 256) rotate(-45)">
      <path d="M -200,0 A 200,60 0 0,0 200,0" stroke="url(#gradGoldRed)" stroke-width="12" />
    </g>
  </g>

  <!-- Layer 3: Shaded Hologram Octahedron Core -->
  <g filter="url(#hologramGlow)">
    <!-- Translucent Shaded Faces -->
    <path d="M 256,256 L 176,256 L 256,176 Z" fill="url(#faceTL)" />
    <path d="M 256,256 L 336,256 L 256,176 Z" fill="url(#faceTR)" />
    <path d="M 256,256 L 176,256 L 256,336 Z" fill="url(#faceBL)" />
    <path d="M 256,256 L 336,256 L 256,336 Z" fill="url(#faceBR)" />

    <!-- Core Wireframe Edges -->
    <path d="M 256,176 L 336,256 L 256,336 L 176,256 Z" fill="none" stroke="#ffffff" stroke-width="8" stroke-linejoin="round" />
    <line x1="176" y1="256" x2="336" y2="256" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
    <line x1="256" y1="176" x2="256" y2="336" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- Layer 4: Front Gyroscope Orbits (Weaving in Front of Core) -->
  <g fill="none" stroke-linecap="round" filter="url(#hologramGlow)">
    <!-- Ring 1 Front -->
    <g transform="translate(256, 256) rotate(-15)">
      <path d="M 200,0 A 200,60 0 0,0 -200,0" stroke="url(#gradCobaltCyanFront)" stroke-width="12" />
      <!-- Satellite node orbiting on Ring 1 -->
      <circle cx="150" cy="40" r="10" fill="#ffffff" filter="url(#nodeGlow)" />
    </g>
    <!-- Ring 2 Front -->
    <g transform="translate(256, 256) rotate(45)">
      <path d="M 200,0 A 200,60 0 0,0 -200,0" stroke="url(#gradCyanGoldFront)" stroke-width="12" />
      <!-- Satellite node orbiting on Ring 2 -->
      <circle cx="-130" cy="-45" r="9" fill="#ffffff" filter="url(#nodeGlow)" />
    </g>
    <!-- Ring 3 Front -->
    <g transform="translate(256, 256) rotate(-45)">
      <path d="M 200,0 A 200,60 0 0,0 -200,0" stroke="url(#gradGoldRedFront)" stroke-width="12" />
      <!-- Satellite node orbiting on Ring 3 -->
      <circle cx="110" cy="-50" r="9" fill="#ffffff" filter="url(#nodeGlow)" />
    </g>
  </g>

  <!-- Layer 5: Central Core Quantum Particle -->
  <circle cx="256" cy="256" r="30" fill="url(#coreGlow)" pointer-events="none" />
  <circle cx="256" cy="256" r="10" fill="#ffffff" filter="url(#nodeGlow)" />
</svg>
